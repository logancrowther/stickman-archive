server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Force revalidation on every load so a deploy is never masked by a
    # browser serving a stale cached copy of the game code.
    location ~* \.(?:js|css|html)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
