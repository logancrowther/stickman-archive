server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The game is fully self-contained (no CDN scripts/fonts/images, no
    # inline scripts, no third-party requests), so this can be strict with
    # no allowlisting needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Force revalidation on every load so a deploy is never masked by a
    # browser serving a stale cached copy of the game code.
    #
    # nginx does NOT inherit add_header directives from the parent server
    # block into a location block that defines its own add_header — and
    # since every real request here resolves to .html/.js/.css, this block
    # is where virtually all responses are actually served from. The
    # security headers above have to be repeated here or they'd never
    # apply to anything.
    location ~* \.(?:js|css|html)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
